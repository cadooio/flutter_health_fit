version: 2.1

orbs:
  flutter: circleci/flutter@2.0.4
  macos: circleci/macos@2.5.2

jobs:
  build_and_test:
    macos:
      xcode: 15.3.0
    steps:
      - checkout
      - flutter/install_sdk_and_pub:
          version: 3.19.6
      - run:
          name: Install Dependencies
          command: flutter pub get
      - run:
          name: Run Tests
          command: flutter test
      - run:
          name: Build iOS
          command: flutter build ios --no-codesign

workflows:
  version: 2
  build_and_test:
    jobs:
      - build_and_test
